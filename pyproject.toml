[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "robotic-mind"
version = "0.1.0"
description = "A shared cognitive workspace for humans and autonomous machines"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "pydantic-settings>=2.7,<3", "sqlalchemy>=2.0,<3", "openai>=1.60,<3", "httpx>=0.28,<1", "numpy>=2,<3", "opencv-python>=4.10,<5", "websockets>=14,<17"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "websockets>=14,<17", "playwright>=1.50,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
