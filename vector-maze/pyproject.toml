[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vector-maze"
version = "0.1.0"
description = "Simulation-first maze navigation for Anki Vector"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pygame>=2.6,<3", "numpy>=2,<3", "opencv-python>=4.10,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]
